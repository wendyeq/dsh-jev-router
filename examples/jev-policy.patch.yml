# Copy to a private profile overlay; set a Harness credential ref before enabling.
- id: dsh-jev-router
  config:
    enabled: false
    credentialRefs: []
    candidates:
      - model: gpt-6-luna
        description: 最省的执行模型。目标清楚、做法已知时用：有界实现、已理解的修复、测试、翻译、摘要、常规配置。不用于开放式调查、不确定的根因、架构取舍，或还要先判断方案的任务。
      - model: gpt-6-sol
        description: 复杂编码和 agent 工作流的默认模型。调查、多文件实现、普通到困难的调试、仓库内的正确性检查，以及在现有系统里把功能做完，都选它。不用于 luna 就能做完的例行执行，也不用于跨系统的架构定案、安全关键的最终判断，或失败模式互相牵连、读改这个仓库收不了尾的端到端难题。任务难、含糊或像在要建议，仍先选它，除非上一句明确排除。
      - model: gpt-6-astra
        description: 最强模型，只用于最难的端到端工作：跨系统的架构取舍、安全关键的最终判断、多来源研究，或约束互相冲突且不是单仓库编码调查能解决的问题。不用于机械执行，也不用于一个仓库里的复杂编码、困难调试或实现建议；那些是 sol。不要因为任务重要、含糊或需要建议就选它。
    # 可选：自动推理强度的下限，键与 effortDescriptions 相同。按适配器顺序只提供这一档及以上；指定的推理强度不受影响。
    # effortFloors:
    #   gpt-6-sol: medium
    effortDescriptions:
      gpt-6-luna:
        low: 做法清楚，改一小处、查一处或跑一次检查。
        medium: 还在这个模型的执行范围内，但要连着几步，局部对不上。
        high: 执行中的困难点：同一处反复失败，或要在已有做法里选一条。不要用它做架构或安全定案。
        xhigh: 大量相似情况要在执行层面对齐，漏一种就会做错。仍不做架构判断。
        max: 这个高效模型能做的最难核对。常规修改不要用。
      gpt-6-sol:
        low: 下一步已经清楚：按现有方案改、读或跑检查。
        medium: 本模型的正常编码：要调查、改多处，或根据一次失败调整。官方默认档。
        high: 复杂调试或深规划：根因还不明，或下一步的改法会改变行为。先对照 medium，确认 high 确实更合适。
        xhigh: 难的编码流程、安全或正确性审查，需要把失败交错想完。评估没有明显收益就不要用。
        max: 已经需要 xhigh，而且这一步再加强推理仍可能改变结论。
      gpt-6-astra:
        low: 方向已经定了，这一步是按结论执行、核对或回答附带问题。
        medium: 本模型的常规推理：多步编码、研究或判断，但路线还清楚。
        high: 复杂推理、难调试或深规划，质量比速度重要。需要和 medium 比较。
        xhigh: 长流程研究、安全审查，或约束互相影响的端到端任务。有明确收益才用。
        max: 最难的一步。已经是 xhigh 仍可能漏掉关键失败时才用。
